plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def apiUrl = providers.gradleProperty('hubApiUrl')
        .orElse('http://10.0.2.2:8080').get()
def endpoint = URI.create(apiUrl)
if (!(endpoint.scheme in ['http', 'https']) || !endpoint.host || endpoint.rawUserInfo ||
        endpoint.rawQuery || endpoint.rawFragment || !(endpoint.rawPath in ['', '/'])) {
    throw new GradleException('hubApiUrl deve conter a origem HTTP ou HTTPS da API, sem caminho ou credenciais.')
}
def apiLiteral = groovy.json.JsonOutput.toJson(apiUrl)

android {
    namespace 'br.com.hubdeservicos.android'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.hubdeservicos.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'API_ORIGEM', apiLiteral
        }
        release {
            buildConfigField 'String', 'API_ORIGEM',
                    endpoint.scheme == 'https' ? apiLiteral : '""'
        }
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20180813'
}
