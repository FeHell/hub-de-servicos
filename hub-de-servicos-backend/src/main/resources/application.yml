spring:
  application:
    name: hub-de-servicos
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-init-sql: >-
        DO $$ BEGIN
          IF current_database() <> 'hub_de_servicos' THEN
            RAISE EXCEPTION 'O Hub de Serviços exige uma conexão ao banco hub_de_servicos.';
          END IF;
        END; $$
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/migration/db.changelog-master.xml

server:
  port: 8080

# OpenAPI Documentation
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

---
spring:
  config:
    activate:
      on-profile: homologacao | producao

hub:
  autenticacao:
    emissor: ${HUB_AUTENTICACAO_EMISSOR}
    chave-privada: ${HUB_AUTENTICACAO_CHAVEPRIVADA}
    chave-publica: ${HUB_AUTENTICACAO_CHAVEPUBLICA}
